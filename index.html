<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T9 OS</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="login">

<h1>T9 OS</h1>

<input
type="password"
id="password"
placeholder="Contraseña">

<button id="loginBtn">
Entrar
</button>

<p id="error"></p>

</div>

<div id="desktop">

<div id="wallpaper"></div>

<div id="icons">

<div class="icon" id="addGames">

<div class="emoji">➕</div>

<p>Add Games</p>

</div>

<div class="icon" id="settings">

<div class="emoji">⚙️</div>

<p>Configuración</p>

</div>

</div>

<div id="window">

<div id="windowBar">

<span id="windowTitle">
T9 OS
</span>

<button id="closeWindow">
✖
</button>

</div>

<iframe
id="frame"
src="">
</iframe>

</div>

<div id="taskbar">

<button id="start">
Inicio
</button>

<div id="clock">
00:00
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
