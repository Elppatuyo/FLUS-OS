<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T9 OS</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Pantalla de bloqueo -->
<div id="lockScreen">

    <div class="loginBox">

        <h1>T9 OS</h1>

        <p>Iniciar sesión</p>

        <input
        id="password"
        type="password"
        placeholder="Contraseña">

        <button id="loginBtn">
            Entrar
        </button>

        <p id="loginError"></p>

    </div>

</div>

<!-- Escritorio -->
<div id="desktop">

    <div id="desktopIcons">

        <div class="desktopIcon" id="addGames">

            <img src="https://cdn-icons-png.flaticon.com/512/1828/1828925.png">

            <span>Add Games</span>

        </div>

        <div class="desktopIcon" id="settingsApp">

            <img src="https://cdn-icons-png.flaticon.com/512/3524/3524659.png">

            <span>Configuración</span>

        </div>

    </div>

    <!-- Barra -->
    <div id="taskbar">

        <button id="startButton">
            T9
        </button>

        <div id="taskbarClock">

            00:00

        </div>

    </div>

</div>

<!-- Ventana -->
<div id="window">

    <div id="windowHeader">

        <span id="windowTitle">
            T9 OS
        </span>

        <button id="closeWindow">
            ✖
        </button>

    </div>

    <div id="windowContent">

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
